<!DOCTYPE html>
<html>
<head>
    <title>Placement Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <h2>Placement System</h2>

        <a href="index.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="companies.html">Companies</a>
        <a href="placements.html">Placements</a>

    </div>


    <!-- Main Content -->
    <div class="main">

        <h1>Placement Dashboard</h1>

        <p>Manage and monitor placement activities</p>


        <!-- Input Section -->

        <div class="input-box">

            <h2>Enter Placement Details</h2>

            <input type="number"
                   id="totalStudents"
                   placeholder="Total Students">

            <input type="number"
                   id="placedStudents"
                   placeholder="Students Placed">

            <input type="number"
                   id="companies"
                   placeholder="Total Companies">

            <input type="number"
                   id="offers"
                   placeholder="Total Offers">

            <button onclick="calculateDashboard()">
                Calculate
            </button>

        </div>


        <!-- Dashboard Cards -->

        <div class="cards">

            <div class="card">
                <h3>Total Students</h3>
                <h2 id="studentCount">0</h2>
            </div>


            <div class="card">
                <h3>Students Placed</h3>
                <h2 id="placedCount">0</h2>
            </div>


            <div class="card">
                <h3>Companies</h3>
                <h2 id="companyCount">0</h2>
            </div>


            <div class="card">
                <h3>Job Offers</h3>
                <h2 id="offerCount">0</h2>
            </div>

        </div>


        <!-- Efficiency -->

        <div class="efficiency">

            <h2>Placement Efficiency</h2>

            <h1 id="percentage">0%</h1>

            <p>Students placed out of total students</p>

        </div>


    </div>


    <script src="js/script.js"></script>

</body>
</html>
